<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Trailmark</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">Trailmark <small>Trail Supply Co.</small></a>
    <nav class="main-nav"></nav>
    <div class="nav-actions">
      <a href="cart.html" class="cart-link">Cart <span class="cart-count hidden" id="cart-count">0</span></a>
      <div id="auth-nav-slot" class="nav-actions"></div>
    </div>
  </div>
</header>

<main class="form-page">
  <div class="eyebrow" style="justify-content:center;margin-bottom:14px;">Welcome back</div>
  <h1 style="text-align:center;font-size:28px;">Log in</h1>

  <div class="form-card" style="margin-top:24px;">
    <div id="login-alert"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log in</button>
    </form>
  </div>
  <p class="form-note">Don't have an account? <a href="register.html" style="color:var(--color-accent);font-weight:600;">Create one</a></p>
  <p class="form-note" style="font-size:12px;">Demo admin login: admin@trailmark.test / admin123</p>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/login.js"></script>
</body>
</html>
